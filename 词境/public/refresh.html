<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f4ef" />
    <title>词境正在更新</title>
    <style>
      :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; color: #20211f; background: #f7f5f0; }
      body { display: grid; min-height: 100dvh; margin: 0; place-items: center; padding: 24px; box-sizing: border-box; }
      main { width: min(420px, 100%); padding: 30px; border: 1px solid rgba(39,43,39,.13); border-radius: 22px; background: rgba(255,255,255,.62); box-shadow: 0 20px 50px rgba(53,54,47,.09); }
      h1 { margin: 0 0 13px; font-family: Georgia, serif; font-size: 30px; font-weight: 400; }
      p { margin: 0; color: #6d706a; line-height: 1.7; }
      .dot { display: inline-block; width: 9px; height: 9px; margin-right: 8px; border-radius: 50%; background: #335f6d; animation: pulse 1s ease-in-out infinite alternate; }
      @keyframes pulse { to { opacity: .25; transform: scale(.72); } }
    </style>
  </head>
  <body>
    <main>
      <h1><span class="dot"></span>正在更新词境</h1>
      <p id="status">正在移除旧界面缓存；学习记录会保留。</p>
    </main>
    <script>
      (async () => {
        try {
          const registrations = "serviceWorker" in navigator ? await navigator.serviceWorker.getRegistrations() : [];
          await Promise.all(registrations.map((registration) => registration.unregister()));
          if ("caches" in window) {
            const names = await caches.keys();
            await Promise.all(names.filter((name) => name.startsWith("wordscape-shell-")).map((name) => caches.delete(name)));
          }
          document.querySelector("#status").textContent = "新版已准备好，正在打开词境。";
          setTimeout(() => location.replace(`./?cache-reset=${Date.now()}`), 700);
        } catch {
          document.querySelector("#status").textContent = "更新完成。请返回词境主页后重新打开一次。";
        }
      })();
    </script>
  </body>
</html>
